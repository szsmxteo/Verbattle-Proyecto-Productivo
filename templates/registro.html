{% extends 'base.html' %}
{% load static %}

{% block title %}Verbattle — Registro Gamer{% endblock %}

{% block content %}
<div class="vb-card text-center py-4">
    <div class="mb-3">
        <h2 class="brand-text fs-1">VER<span>BATTLE</span> 🕹️</h2>
        <small class="text-muted fw-bold">Crea tu perfil de competidor</small>
    </div>

    <h5 class="text-white fw-extrabold mb-3">¡ÚNETE A LA COMUNIDAD!</h5>

    <form action="{% url 'home' %}" method="POST" class="text-start">
        {% csrf_token %}
        <!-- GamerTag / Usuario -->
        <div class="mb-3">
            <label class="form-label text-info fw-bold">GamerTag / Apodo:</label>
            <input type="text" name="gamer_tag" class="form-control bg-dark text-white border-secondary rounded-3" placeholder="Ej. ProGamer_2026" required>
        </div>

        <!-- Correo Electrónico -->
        <div class="mb-3">
            <label class="form-label text-info fw-bold">Correo Institucional / Personal:</label>
            <input type="email" name="email" class="form-control bg-dark text-white border-secondary rounded-3" placeholder="estudiante@colegio.edu.co" required>
        </div>

        <!-- Contraseña -->
        <div class="mb-3">
            <label class="form-label text-info fw-bold">Contraseña:</label>
            <input type="password" name="password" class="form-control bg-dark text-white border-secondary rounded-3" placeholder="••••••••" required>
        </div>

        <!-- Selección de Nivel de Dominio -->
        <div class="mb-4">
            <label class="form-label text-info fw-bold">Nivel de Conocimiento (Inglés Técnico):</label>
            <select name="nivel_dominio" class="form-select bg-dark text-white border-secondary rounded-3">
                <option value="BAJO" {% if perfil.nivel_dominio == 'BAJO' %}selected{% endif %}>🟢 Bajo / Principiante</option>
                <option value="MEDIO" {% if perfil.nivel_dominio == 'MEDIO' %}selected{% endif %}>🟡 Medio / Intermedio</option>
                <option value="ALTO" {% if perfil.nivel_dominio == 'ALTO' %}selected{% endif %}>🔴 Alto / Avanzado</option>
            </select>
        </div>

        <button type="submit" class="btn btn-verbattle-arcade mb-3">
            🚀 CREAR MI CUENTA GAMER
        </button>
    </form>

    <div class="border-top border-secondary pt-3 mt-2">
        <small class="text-muted">¿Ya posees una cuenta registrada?</small><br>
        <a href="{% url 'login' %}" class="text-success fw-bold">Inicia Sesión aquí</a>
    </div>
</div>
{% endblock %}
