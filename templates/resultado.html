{% extends 'base.html' %}
{% load static %}

{% block title %}Verbattle — Resultado del Duelo{% endblock %}

{% block content %}
<!-- Tarjeta Gamer de Resumen de Partida -->
<div class="vb-card text-center py-4 border-success">
    <div class="fs-1 mb-2">🏆</div>
    <h3 class="fw-black text-success text-uppercase mb-3">¡Victoria en el Duelo!</h3>
    
    <div class="my-3 p-3 bg-dark rounded border border-secondary">
        <div class="d-flex justify-content-around align-items-center">
            <div>
                <small class="text-muted d-block fw-bold">TU PUNTAJE</small>
                <span class="fs-4 fw-black text-success">+300 PTS</span>
            </div>
            <div class="border-end border-secondary" style="height: 40px;"></div>
            <div>
                <small class="text-muted d-block fw-bold">RIVAL</small>
                <span class="fs-4 fw-black text-danger">0 PTS</span>
            </div>
        </div>
    </div>

    <div class="alert alert-success bg-dark border-success text-success fw-bold my-3">
        🔥 ¡Aumentaste tu racha a 3 victorias consecutivas!
    </div>

    <div class="text-info fw-black fs-5 my-2">
        Nuevo Puntaje Global: 1,700 PTS
    </div>
</div>

<!-- Botón de Retorno -->
<div class="mt-4">
    <a href="{% url 'home' %}" class="btn btn-verbattle btn-lg text-uppercase">
        <i class="bi bi-house-door-fill me-2"></i> Volver al Lobby
    </a>
</div>
{% endblock %}
